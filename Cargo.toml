[workspace]
resolver = "2"
members = ["crates/unicode-math", "crates/core", "crates/svg", "crates/pdf", "crates/png", "crates/cli", "crates/wasm", "crates/wasi"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/wspringer/latex-math-wasi"
rust-version = "1.85"

[workspace.dependencies]
latex-math-core = { path = "crates/core" }
latex-math-svg = { path = "crates/svg" }
latex-math-pdf = { path = "crates/pdf" }
latex-math-png = { path = "crates/png" }
latex-math-wasm = { path = "crates/wasm" }
unicode-math = { path = "crates/unicode-math" }
ttf-parser = "0.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
