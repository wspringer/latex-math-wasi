name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: target/visual-diff
          if-no-files-found: ignore

  wasm:
    # Guards the no-C constraint: a transitive `cc`/`*-sys` dependency fails this build.
    name: wasm32-wasip1 + wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude latex-wasi-cli --target wasm32-wasip1
      - run: cargo build --workspace --exclude latex-wasi-cli --target wasm32-unknown-unknown
      - name: No C toolchain crates in the tree
        run: |
          set -e
          for t in wasm32-wasip1 wasm32-unknown-unknown; do
            if cargo tree --workspace -e normal --target "$t" --prefix none | sort -u | grep -E '^(cc|cmake|bindgen|pkg-config) |-sys '; then
              echo "C-toolchain crate found for $t"; exit 1
            fi
          done
