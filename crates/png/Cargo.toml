[package]
name = "latex-math-png"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Render tree -> PNG, by rasterizing the SVG output with resvg."

[lib]
name = "latex_math_png"

[dependencies]
latex-math-core.workspace = true
latex-math-svg.workspace = true
# No default features: `text` would pull in fontdb and system font discovery, and
# `raster-images` decoders; our SVG is paths and rects only.
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
# Only for the "not blank" comparison in tests; the crate itself never decodes PNGs.
resvg = { version = "0.48", default-features = false }
