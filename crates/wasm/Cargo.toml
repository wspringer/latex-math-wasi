[package]
name = "latex-wasi-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "JSON request -> SVG/PDF bytes; C-ABI exports for wasm32-unknown-unknown (browser), shared request handling for the wasip1 command."

[lib]
name = "latex_wasi_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
latex-wasi-core.workspace = true
latex-wasi-svg.workspace = true
latex-wasi-pdf.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
