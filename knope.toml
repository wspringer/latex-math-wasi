# Knope owns the one version axis this project has: the workspace version in
# Cargo.toml (all crates share it via `version.workspace = true`). Change files in
# .changeset/ are the only release source — commit subjects never bump anything.
#
# Unlike ../lilypond-wasi there is no second, upstream axis in the tag: the engine
# is vendored (crates/core, from KenyC/ReX — see crates/core/REX-UPSTREAM) and the
# libraries we depend on (ttf-parser, pdf-writer, subsetter, …) are pinned in
# Cargo.lock and compiled *into* the artifact. A dependency bump is a change to our
# artifact like any other: it ships in the next release and, when it changes
# behaviour or output, gets a change file. The versions that went into a release are
# recorded in its provenance.json (release.yml).
[package]
versioned_files = [
  "Cargo.toml",
  { path = "Cargo.lock", dependency = "latex-wasi-core" },
  { path = "Cargo.lock", dependency = "latex-wasi-svg" },
  { path = "Cargo.lock", dependency = "latex-wasi-pdf" },
  { path = "Cargo.lock", dependency = "latex-wasi-cli" },
  { path = "Cargo.lock", dependency = "latex-wasi-wasm" },
  { path = "Cargo.lock", dependency = "latex-wasi-wasi" },
]
changelog = "CHANGELOG.md"

# The Knope Bot GitHub App (https://github.com/marketplace/knope-bot) keeps a
# release PR open with the next version + changelog. Merging it bumps the version,
# tags v<version> and publishes the GitHub release; release.yml then attaches the
# wasm modules to it.
[bot.releases]
enabled = true

[github]
owner = "wspringer"
repo = "latex-wasi"

[changes]
ignore_conventional_commits = true
